---
openapi: 3.0.1
info:
  title: Biblioteca Municipal Ney Pontes - API
  version: v1
  description: API para o sistema da Biblioteca Municipal Ney Pontes
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  "/api/v1/categorias":
    get:
      summary: Listar categorias
      tags:
      - Categorias
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    nome:
                      type: string
                    created_at:
                      type: string
                      format: date-time
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      summary: Cadastrar categoria
      tags:
      - Categorias
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Categoria cadastrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nome:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: Ficção
              required:
              - nome
  "/api/v1/categorias/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Detalhes da categoria
      tags:
      - Categorias
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Categoria encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nome:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '404':
          description: Categoria não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    put:
      summary: Atualizar categoria
      tags:
      - Categorias
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nome:
                    type: string
                  created_at:
                    type: string
                    format: date-time
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: Ficção Científica
              required:
              - nome
    delete:
      summary: Remover categoria
      tags:
      - Categorias
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Categoria removida
  "/api/v1/cidadaos":
    get:
      summary: Listar cidadaos
      tags:
      - Cidadaos
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista de cidadaos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    nome_completo:
                      type: string
                    cpf:
                      type: string
                    telefone:
                      type: string
                    email:
                      type: string
                    senha_emprestimo:
                      type: string
                    created_at:
                      type: string
                      format: date-time
        '403':
          description: Acesso negado (cidadao)
    post:
      summary: Cadastrar cidadao (admin)
      tags:
      - Cidadaos
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Cidadao cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nome_completo:
                    type: string
                  cpf:
                    type: string
                  telefone:
                    type: string
                  email:
                    type: string
                  senha_emprestimo:
                    type: string
                  created_at:
                    type: string
                    format: date-time
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome_completo:
                  type: string
                  example: Joao Silva
                email:
                  type: string
                  example: joao@email.com
                cpf:
                  type: string
                  example: 111.222.333-44
                telefone:
                  type: string
                  example: '84988888888'
                senha_emprestimo:
                  type: string
                  example: abc123
              required:
              - nome_completo
              - email
              - cpf
              - telefone
              - senha_emprestimo
  "/api/v1/cidadaos/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Detalhes do cidadao
      tags:
      - Cidadaos
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cidadao ve o proprio perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nome_completo:
                    type: string
                  cpf:
                    type: string
                  telefone:
                    type: string
                  email:
                    type: string
                  senha_emprestimo:
                    type: string
                  created_at:
                    type: string
                    format: date-time
    put:
      summary: Atualizar cidadao
      tags:
      - Cidadaos
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Cidadao atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nome_completo:
                    type: string
                  cpf:
                    type: string
                  telefone:
                    type: string
                  email:
                    type: string
                  senha_emprestimo:
                    type: string
                  created_at:
                    type: string
                    format: date-time
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome_completo:
                  type: string
                telefone:
                  type: string
                senha_emprestimo:
                  type: string
    delete:
      summary: Remover cidadao
      tags:
      - Cidadaos
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Cidadao removido
  "/api/v1/registro":
    post:
      summary: Cadastro publico de cidadao
      tags:
      - Registro
      parameters: []
      responses:
        '201':
          description: Cadastro realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                  usuario_biblioteca:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome_completo:
                        type: string
                      cpf:
                        type: string
                      telefone:
                        type: string
                      senha_emprestimo:
                        type: string
                  token:
                    type: string
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: Joao
                email:
                  type: string
                  example: joao@email.com
                password:
                  type: string
                  example: senha123
                password_confirmation:
                  type: string
                  example: senha123
                nome_completo:
                  type: string
                  example: Joao da Silva
                cpf:
                  type: string
                  example: 111.222.333-44
                telefone:
                  type: string
                  example: '84988888888'
                senha_emprestimo:
                  type: string
                  example: abc123
              required:
              - nome
              - email
              - password
              - password_confirmation
              - nome_completo
              - cpf
              - telefone
              - senha_emprestimo
  "/api/v1/perfil":
    get:
      summary: Ver perfil do cidadao logado
      tags:
      - Perfil
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Perfil encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nome_completo:
                    type: string
                  cpf:
                    type: string
                  telefone:
                    type: string
                  email:
                    type: string
                  senha_emprestimo:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '404':
          description: Bibliotecario nao tem perfil
    put:
      summary: Atualizar perfil do cidadao logado
      tags:
      - Perfil
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nome_completo:
                    type: string
                  cpf:
                    type: string
                  telefone:
                    type: string
                  email:
                    type: string
                  senha_emprestimo:
                    type: string
                  created_at:
                    type: string
                    format: date-time
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome_completo:
                  type: string
                telefone:
                  type: string
                senha_emprestimo:
                  type: string
  "/api/v1/emprestimos":
    get:
      summary: Listar emprestimos
      tags:
      - Emprestimos
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista de emprestimos (bibliotecario)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    status:
                      type: string
                    data_emprestimo:
                      type: string
                      format: date-time
                    data_devolucao_prevista:
                      type: string
                      format: date
                    data_devolucao_real:
                      type: string
                      format: date
                      nullable: true
                    renovacoes:
                      type: integer
                    livro:
                      type: object
                      properties:
                        id:
                          type: integer
                        titulo:
                          type: string
                        autor:
                          type: string
                    usuario_biblioteca:
                      type: object
                      properties:
                        id:
                          type: integer
                        nome_completo:
                          type: string
                        cpf:
                          type: string
                    multa:
                      type: object
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
    post:
      summary: Realizar emprestimo
      tags:
      - Emprestimos
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Emprestimo realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                  data_emprestimo:
                    type: string
                    format: date-time
                  data_devolucao_prevista:
                    type: string
                    format: date
                  data_devolucao_real:
                    type: string
                    format: date
                    nullable: true
                  renovacoes:
                    type: integer
                  livro:
                    type: object
                    properties:
                      id:
                        type: integer
                      titulo:
                        type: string
                      autor:
                        type: string
                  usuario_biblioteca:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome_completo:
                        type: string
                      cpf:
                        type: string
                  multa:
                    type: object
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
        '401':
          description: Senha invalida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                livro_id:
                  type: integer
                  example: 1
                usuario_biblioteca_id:
                  type: integer
                  example: 1
                senha_emprestimo:
                  type: string
                  example: abc123
              required:
              - livro_id
              - usuario_biblioteca_id
              - senha_emprestimo
  "/api/v1/emprestimos/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Detalhes do emprestimo
      tags:
      - Emprestimos
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Emprestimo encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                  data_emprestimo:
                    type: string
                    format: date-time
                  data_devolucao_prevista:
                    type: string
                    format: date
                  data_devolucao_real:
                    type: string
                    format: date
                    nullable: true
                  renovacoes:
                    type: integer
                  livro:
                    type: object
                    properties:
                      id:
                        type: integer
                      titulo:
                        type: string
                      autor:
                        type: string
                  usuario_biblioteca:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome_completo:
                        type: string
                      cpf:
                        type: string
                  multa:
                    type: object
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
  "/api/v1/emprestimos/{id}/devolver":
    put:
      summary: Registrar devolucao
      tags:
      - Emprestimos
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Devolucao registrada
  "/api/v1/emprestimos/{id}/renovar":
    put:
      summary: Renovar emprestimo
      tags:
      - Emprestimos
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Emprestimo renovado
  "/api/v1/emprestimos/atrasados":
    get:
      summary: Relatorio de livros em atraso
      tags:
      - Emprestimos
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista de atrasados
  "/api/v1/emprestimos/historico":
    get:
      summary: Historico de emprestimos por usuario
      tags:
      - Emprestimos
      security:
      - bearerAuth: []
      parameters:
      - name: usuario_biblioteca_id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Historico encontrado
  "/api/v1/livros":
    get:
      summary: Listar livros
      tags:
      - Livros
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista de livros
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    titulo:
                      type: string
                    autor:
                      type: string
                    status:
                      type: string
                    observacoes:
                      type: string
                      nullable: true
                    categoria:
                      type: object
                      properties:
                        id:
                          type: integer
                        nome:
                          type: string
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
    post:
      summary: Cadastrar livro
      tags:
      - Livros
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Livro cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  titulo:
                    type: string
                  autor:
                    type: string
                  status:
                    type: string
                  observacoes:
                    type: string
                    nullable: true
                  categoria:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                  example: Dom Casmurro
                autor:
                  type: string
                  example: Machado de Assis
                categoria_id:
                  type: integer
                  example: 1
                status:
                  type: integer
                  example: 0
                observacoes:
                  type: string
                  example: Edicao especial
              required:
              - titulo
              - autor
              - categoria_id
  "/api/v1/livros/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Detalhes do livro
      tags:
      - Livros
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Livro encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  titulo:
                    type: string
                  autor:
                    type: string
                  status:
                    type: string
                  observacoes:
                    type: string
                    nullable: true
                  categoria:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '404':
          description: Livro nao encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    put:
      summary: Atualizar livro
      tags:
      - Livros
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Livro atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  titulo:
                    type: string
                  autor:
                    type: string
                  status:
                    type: string
                  observacoes:
                    type: string
                    nullable: true
                  categoria:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                autor:
                  type: string
                categoria_id:
                  type: integer
                status:
                  type: integer
                observacoes:
                  type: string
    delete:
      summary: Remover livro
      tags:
      - Livros
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Livro removido
  "/api/v1/login":
    post:
      summary: Autenticar bibliotecário
      tags:
      - Autenticação
      parameters: []
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                      email:
                        type: string
                      first_login:
                        type: boolean
                  token:
                    type: string
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: admin@biblioteca.com
                password:
                  type: string
                  example: senha123
              required:
              - email
              - password
  "/api/v1/logout":
    delete:
      summary: Encerrar sessão
      tags:
      - Autenticação
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Logout realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  "/api/v1/users/password":
    post:
      summary: Solicitar recuperação de senha
      tags:
      - Autenticação
      parameters: []
      responses:
        '200':
          description: Instruções enviadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: E-mail não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
  "/api/v1/users":
    get:
      summary: Listar bibliotecários
      tags:
      - Bibliotecários
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista de bibliotecários
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    nome:
                      type: string
                    email:
                      type: string
                    first_login:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      summary: Cadastrar bibliotecário
      tags:
      - Bibliotecários
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Bibliotecário cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                      email:
                        type: string
                      first_login:
                        type: boolean
                  temporary_password:
                    type: string
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: Novo Bibliotecário
                email:
                  type: string
                  example: novo@biblioteca.com
              required:
              - nome
              - email
  "/api/v1/users/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Detalhes do bibliotecário
      tags:
      - Bibliotecários
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Detalhes encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
