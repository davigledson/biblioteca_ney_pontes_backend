default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>


development:
  <<: *default
  database: biblioteca_ney_pontes_backend_development

test:
  <<: *default
  database: biblioteca_ney_pontes_backend_test


production:
  primary: &primary_production
    <<: *default
    database: biblioteca_ney_pontes_backend_production
    username: biblioteca_ney_pontes_backend
    password: <%= ENV["BIBLIOTECA_NEY_PONTES_BACKEND_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: biblioteca_ney_pontes_backend_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: biblioteca_ney_pontes_backend_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: biblioteca_ney_pontes_backend_production_cable
    migrations_paths: db/cable_migrate